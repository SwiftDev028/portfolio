ction'],['Transportation','Rail, metro and intermodal infrastructure for growing cities.','Infrastructure · Engineering']];addEventListener('DOMContentLoaded',()=>{industryCards.innerHTML=inds.map((x,i)=>`<article class="card industry-card reveal"><b>${String(i+1).padStart(2,'0')}</b><h3>${x[0]}</h3><p>${x[1]}</p><a class="arrow-link" href="projects.html">View case studies</a></article>`).join('');industryTable.innerHTML=inds.map(x=>`<div class="industry-row"><h3>${x[0]}</h3><p>${x[1]}</p><p><b>Services</b><br>${x[2]}</p></div>`).join('')})</script></body></html>
