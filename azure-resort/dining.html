<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Oceanfront fine dining and sunset experiences at AZURE RESORT."><title>Dining — AZURE RESORT</title><link rel="stylesheet" href="css/style.css"></head><body><main><section class="page-hero" style="background-image:url('assets/images/dining.jpg')"><div class="container"><span class="eyebrow">Taste of the coast</span><h1>Exceptional Dining Experiences</h1><p>Seasonal ingredients, thoughtful hospitality and settings shaped by the sea.</p></div></section><section class="section"><div class="container"><div class="grid three" id="restaurants"></div></div></section></main><script src="js/app.js"></script><script>document.querySelector('#restaurants').innerHTML=dining.map((x,i)=>`<article class="card reveal"><div class="card-img"><img src="assets/images/dining.jpg" alt="${x[0]}"></div><div class="card-body"><span class="eyebrow">${x[1]}</span><h3>${x[0]}</h3><p>${i===0?'An intimate tasting-menu destination led by the rhythm of the Mediterranean.':i===1?'Daily catches, open-fire cooking and relaxed lunches steps from the sea.':'Rooftop cocktails, live music and the resort’s finest sunset perspective.'}</p><div class="amenities"><span>${x[2]}</span><span>${x[3]}</span></div><b>Chef recommends: ${x[4]}</b><a class="btn btn-gold" href="contact.html">Reserve a Table</a></div></article>`).join('');observe()</script></body></html>
