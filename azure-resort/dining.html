<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Высокая гастрономия, морепродукты и рестораны с видом на океан в AZURE RESORT."><title>Рестораны — AZURE RESORT</title><link rel="stylesheet" href="css/style.css?v=20260615-ru"></head><body><main><section class="page-hero" style="background-image:url('assets/images/dining.jpg')"><div class="container"><span class="eyebrow">Вкус побережья</span><h1>Исключительные гастрономические впечатления</h1><p>Сезонные продукты, внимательный сервис и атмосфера, вдохновленная морем.</p></div></section><section class="section"><div class="container"><div class="grid three" id="restaurants"></div></div></section></main><script src="js/app.js"></script><script>document.querySelector('#restaurants').innerHTML=dining.map((x,i)=>`<article class="card reveal"><div class="card-img"><img src="assets/images/dining.jpg" alt="${x[0]}"></div><div class="card-body"><span class="eyebrow">${x[1]}</span><h3>${x[0]}</h3><p>${i===0?'Камерный ресторан с дегустационным меню в ритме Средиземноморья.':i===1?'Свежий улов, блюда на открытом огне и неспешные обеды у самого моря.':'Коктейли на крыше, живая музыка и лучший вид на закат.'}</p><div class="amenities"><span>${x[2]}</span><span>${x[3]}</span></div><b>Шеф рекомендует: ${x[4]}</b><a class="btn btn-gold" href="contact.html">Забронировать стол</a></div></article>`).join('');observe()</script></body></html>
