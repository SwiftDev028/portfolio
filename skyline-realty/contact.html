<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — SKYLINE REALTY</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <main>
    <section class="page-hero">
      <div class="container reveal">
        <span class="tag">Private enquiries</span>
        <h1>Let’s discuss your next property.</h1>
        <p>Share your objectives and a SKYLINE REALTY advisor will respond confidentially.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="contact">
          <div class="contact-dark reveal">
            <span class="tag">Direct contact</span>
            <h2>Global reach.<br>Personal service.</h2>
            <span>TELEGRAM</span>
            <a href="https://t.me/almirkhialov">@almirkhialov</a>
            <span>EMAIL</span>
            <a href="mailto:almirkhialov@outlook.com">almirkhialov@outlook.com</a>
            <span>OFFICE</span>
            <p>Mayfair, London<br>By appointment</p>
          </div>
          <form class="formbox reveal">
            <div class="formgrid">
              <label>Full name<input required></label>
              <label>Email<input type="email" required></label>
              <label>Phone<input type="tel"></label>
              <label>Interest<select><option>Buying property</option><option>Selling property</option><option>Investment</option><option>Property management</option><option>Relocation</option></select></label>
              <label>Preferred location<input placeholder="London, Dubai, Monaco…"></label>
              <label>Budget<input placeholder="£1,000,000+"></label>
            </div>
            <label style="margin-top:14px">How can we help?<textarea rows="5" required></textarea></label>
            <button class="btn btn-dark lead-submit" style="margin-top:18px">Submit Private Enquiry</button>
          </form>
        </div>
      </div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
