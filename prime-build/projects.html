<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проекты PRIME BUILD — портфолио ремонтов</title><meta name="description" content="Реализованные квартиры, новостройки и коммерческие интерьеры PRIME BUILD."><link rel="stylesheet" href="css/style.css"><script src="js/app.js" defer></script></head><body data-page="projects"><main><section class="page-hero"><div class="container"><span class="section-tag">Портфолио</span><h1>Проекты с продуманной архитектурой и точной реализацией</h1></div></section><section class="section"><div class="container"><div class="filters"><button class="filter active" data-filter="all">Все</button><button class="filter" data-filter="new">Новостройки</button><button class="filter" data-filter="secondary">Вторичное жилье</button><button class="filter" data-filter="premium">Премиальный ремонт</button><button class="filter" data-filter="commercial">Коммерческие</button><button class="filter" data-filter="high">3+ млн ₽</button></div><div class="grid projects" id="projects-all"></div></div></section></main><script>addEventListener('DOMContentLoaded',()=>{projectsAll=document.querySelector('#projects-all');projectsAll.innerHTML=projectCards();document.querySelectorAll('.reveal').forEach(x=>reveal.observe(x));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.project-card').forEach(c=>c.hidden=b.dataset.filter!=='all'&&!c.dataset.category.includes(b.dataset.filter))})})</script></body></html>
