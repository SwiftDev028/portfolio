<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калькулятор ремонта PRIME BUILD</title><meta name="description" content="Рассчитайте предварительную стоимость ремонта квартиры онлайн."><link rel="stylesheet" href="css/style.css"><script src="js/app.js" defer></script></head><body data-page="calculator"><main><section class="page-hero"><div class="container"><span class="section-tag">Онлайн-расчет</span><h1>Калькулятор стоимости ремонта</h1><p>Укажите основные параметры объекта. Расчет носит предварительный характер.</p></div></section><section class="section"><div class="container" id="full-calculator"></div></section></main><script>addEventListener('DOMContentLoaded',()=>{document.querySelector('#full-calculator').innerHTML=calculator();document.querySelectorAll('.calc-form').forEach(f=>{f.querySelectorAll('.lead-field').forEach(x=>x.style.display='grid');f.addEventListener('input',()=>recalc(f));f.onsubmit=e=>{e.preventDefault();recalc(f)}});document.querySelector('.submit-lead').onclick=()=>{let t=document.querySelector('.toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}})</script></body></html>
